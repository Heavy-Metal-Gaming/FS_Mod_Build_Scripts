name: Release

on:
  push:
    tags:
      - 'release/*'
      - 'draft-release/*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      fs_versions: ${{ steps.meta.outputs.fs_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse tag metadata
        id: meta
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_REF" == draft-release/* ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            TAG="${TAG_REF#draft-release/}"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            TAG="${TAG_REF#release/}"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          # Determine if this is a pre-release
          if echo "$TAG" | grep -qE '-(alpha|beta)\.'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Read FS versions to build from config file
          FS_VERSIONS=$(cat fs_versions.json | jq -c '.versions')
          echo "fs_versions=${FS_VERSIONS}" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fs_version: ${{ fromJson(needs.prepare.outputs.fs_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve mod name
        id: mod
        run: |
          MOD_NAME=$(grep -oP '(?<=<title>)[^<]*(?=</title>)' \
            FS${{ matrix.fs_version }}_Src/modDesc.xml | head -1 | sed 's/[^a-zA-Z0-9_]//g')
          echo "mod_name=FS${{ matrix.fs_version }}_${MOD_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # Option A: always use the latest release of the build scripts
      - name: Download build scripts (latest)
        run: |
          BUILD_SH_URL=$(curl -s https://api.github.com/repos/Heavy-Metal-Gaming/FS_Mod_Build_Scripts/releases/latest \
            | jq -r '.assets[] | select(.name == "build.sh") | .browser_download_url')
          curl -fLo build.sh "$BUILD_SH_URL"
          chmod +x build.sh

      # Option B: pin to a specific version of the build scripts
      # - name: Download build scripts (pinned v1.2.0)
      #   run: |
      #     BASE="https://github.com/Heavy-Metal-Gaming/FS_Mod_Build_Scripts/releases/download/release%2Fv1.2.0"
      #     curl -fLo build.sh "${BASE}/build.sh"
      #     chmod +x build.sh

      - name: Build mod artifact
        run: ./build.sh build --mod_path "${{ github.workspace }}" --fs_ver ${{ matrix.fs_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.mod.outputs.mod_name }}
          path: dist/${{ steps.mod.outputs.mod_name }}.zip

  publish:
    needs: [prepare, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect zip files
        run: |
          find artifacts -name '*.zip' -exec cp {} . \;
          ls -la *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release/${{ needs.prepare.outputs.version }}
          name: "v${{ needs.prepare.outputs.version }}"
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          draft: ${{ needs.prepare.outputs.draft }}
          generate_release_notes: true
          files: "*.zip"
